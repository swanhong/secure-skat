run_dir = "output/pca-test"
chromosomes = [21, 22]

genotype = "rewrite/testdata/1kgenome/generated/genotype/chr{chromosome}"
gene_panel = "rewrite/testdata/1kgenome/generated/gene_panel/chr{chromosome}.tsv"
annotation = "rewrite/testdata/1kgenome/generated/annotation/chr{chromosome}.tsv"
phenotype = "rewrite/testdata/1kgenome/generated/phenotype.csv"
covariate = "rewrite/testdata/1kgenome/generated/ancestry_pred.tsv"

phenotype_id_column = "IID"
covariate_id_column = "research_id"
covariate_column = "pca_features"
phenotype_columns = ["phenotype1", "phenotype2"]
num_cov = 16
masks = ["LoF=HC"]
max_maf = 0.01
samples_per_cohort = 1200
sample_seed = 42
role_seed = 42

ckks = "PN14QP436S45"
data_bits = 60
fractional_bits = 30
probes = 30
seed = 42
port_base = 18000
plink2_bin = "plink2"

[gene_selection]
mode = "random"
per_chromosome = 20
seed = 42
# option1: from file
#   mode = "file"
#   path = "${HOME}/selected_genes.tsv"
# option2: all
#   mode = "all"
