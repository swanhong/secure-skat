run_dir = "output/prep-test"
chromosomes = [21, 22]

genotype = "rewrite/testdata/1kgenome/generated/genotype/chr{chromosome}"
gene_panel = "rewrite/testdata/1kgenome/generated/gene_panel/chr{chromosome}.tsv"
annotation = "rewrite/testdata/1kgenome/generated/annotation/chr{chromosome}.tsv"
phenotype = "rewrite/testdata/1kgenome/generated/phenotype.csv"
covariate = "rewrite/testdata/1kgenome/generated/covariates.tsv"

phenotype_id_column = "IID"
covariate_id_column = "IID"
phenotype_columns = ["phenotype1", "phenotype2"]
covariate_columns = [
  "superpop_AFR",
  "superpop_AMR",
  "superpop_EAS",
  "superpop_EUR",
]
masks = ["LoF=HC"]
samples_per_cohort = 10
sample_seed = 42
role_seed = 42

ckks = "PN14QP436S45"
data_bits = 60
fractional_bits = 30
probes = 128
seed = 42
port_base = 18000
plink2_bin = "plink2"

[gene_selection]
mode = "random"
per_chromosome = 5
seed = 42
