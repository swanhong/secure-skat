run_dir = "output/mvp-test"

genotype = "data/mvp-test/split/genotype/exome.chr{chromosome}"
gene_panel = "data/mvp-test/split/gene_panel/chr{chromosome}.tsv"
annotation = "data/mvp-test/split/annotation/chr{chromosome}.tsv"
phenotype = "data/mvp-test/split/phenotype.csv"
covariate = "data/mvp-test/split/covariate/{anc}_joint.tsv"
ancestry = "data/mvp-test/split/ancestry_preds.tsv"

phenotype_id_column = "IID"
covariate_id_column = "IID"
is_cov_single_column = false
covariate_columns = [
    "PC1", "PC2", "PC3", "PC4", "PC5",
    "PC6", "PC7", "PC8", "PC9", "PC10",
    "GENDER_REGULAR", "OTHER_GENDER",
    "age_at_profile", "age_sq", "affiliation",
]
ancestry_id_column = "IID"
ancestry_column = "ancestry"
local_max_maf = 0.05
samples_per_cohort = 100
shared_rate = 0.6
plink2_bin = "plink2"

[gene_selection]
mode = "random"
per_chromosome = 50
